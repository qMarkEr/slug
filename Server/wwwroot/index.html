<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC Temperature Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #121212;
      --fg: #e0e0e0;
      --accent-cpu: #ff5555;
      --accent-gpu: #55b6ff;
    }
    body {
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #00aaff;
    }
    .temps {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
      font-size: 1.5rem;
    }
    .temp {
      background: #1e1e1e;
      padding: 1rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .label {
      display: block;
      font-size: 0.9rem;
      color: #aaa;
    }
    canvas {
      background: #1b1b1b;
      border-radius: 1rem;
      padding: 1rem;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <h1>🌡️ System Temperature Monitor</h1>
  <button id="sleepButton" style="
  padding: 12px 22px;
  background: #ff4444;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 1.2rem;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(255,0,0,0.4);
">
  💤 Put PC to Sleep
</button>

<script>
document.getElementById("sleepButton").onclick = async () => {
  if (!confirm("Are you sure you want to put this PC to sleep?")) return;

  try {
    await fetch("/api/control/sleep", {
      method: "POST"
    });
  } catch (e) {
    alert("Sleep request failed!");
  }
};
</script>

  <div class="temps">
    <div class="temp">
      <span class="label">CPU Temp</span>
      <span id="cpu">--</span> °C
    </div>
    <div class="temp">
      <span class="label">GPU Temp</span>
      <span id="gpu">--</span> °C
    </div>
  </div>

  <script>

    async function updateTemps() {
      try {
        const res = await fetch("/api/temps?_=" + Date.now());
        const data = await res.json();
        const now = new Date().toLocaleTimeString();

        // Update values
        document.getElementById("cpu").textContent = data.cpu?.toFixed(1) ?? "--";
        document.getElementById("gpu").textContent = data.gpu?.toFixed(1) ?? "--";

      } catch (err) {
        console.error("Error fetching temps:", err);
      }
    }

    // Initial + every second
    updateTemps();
    setInterval(updateTemps, 1000);
  </script>
</body>
</html>
